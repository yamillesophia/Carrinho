<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="carrinho.css">
    <title>Carrinho</title>
</head>
<body>
 
    <!-- Modal de Ofertas -->
    <div id="modalOfertas" class="modal">
        <div class="modal-content">
            <h2>Não vá ainda! Confira nossas ofertas!</h2>
            <ul>
                <li>Brownie - 8.00</li>
                <li>Palha Italiana - 8.00</li>
                <li>Bombom - 3.00</li>
                <li>Chiclete - 2.00</li>
            </ul>
            <button onclick="fecharModal()">Fechar</button>
        </div>
    </div>
    <div class="container">
        <div class="caixa">
            <h1>Carrinho</h1>
 
        <div class="caixa">
            <h2>Adicionar Produto</h2>
            <div class="form-group">
                <label for="produto">Produto:</label>
                <select id="produto" onchange="atualizarCampos()">
                    <option value="001" data-preco="35.00">Bolo de Chocolate</option>
                    <option value="002" data-preco="10.00">Sorvete</option>
                    <option value="003" data-preco="2.00">Bala Halls</option>
                    <option value="004" data-preco="18.00">Açaí</option>
                    <option value="005" data-preco="37.00">Torta de Limão</option>
                    <option value="006" data-preco="30.00">Bolo de Cenoura</option>
                    <option value="007" data-preco="7.00">Cookies</option>
                    <option value="008" data-preco="10.00">Chocolate</option>
                    <option value="009" data-preco="95.00">Ovo de páscoa</option>
                </select>
 
                <label for="codigo">Código:</label>
                <input type="text" id="codigo" readonly>
 
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" value="1">
 
                <label for="preco">Valor Unitário:</label>
                <input type="number" id="preco" readonly>
 
                <button onclick="adicionarAoCarrinho()">Adicionar ao Carrinho</button>
               
            </div>
        </div>
 
        <div class="caixa">
            <h2>Itens do Carrinho</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                        <th>Total</th>
                    </tr>
             
                </thead>
                <tbody id="lista-carrinho">
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4">Total do Carrinho:</td>
                        <td id="total-carrinho">0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
 
    <!-- Botão que irá ativar a música -->
    <button onclick="iniciarMusica()">Clique para ouvir a música</button>

    <!-- Elemento de áudio -->
    <audio id="audio">
        <source src="Sweet Like Candy.mp3" type="audio/mpeg">
    </audio>
</body>
<script src="carrinho.js"></script>
</html>
 
</body>
</html>
